name: Offline verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression (all external services fake)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Node plugins (fake workers)
        run: node --test tests/*.test.mjs
      - name: Whitespace
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          else
            # Preserve the imported templates' existing blank lines at EOF.
            git -c core.whitespace=-blank-at-eof diff-tree --root --no-commit-id -r --check HEAD
          fi
      - name: Render and verify units, sandbox startup interactions
        env:
          EMAIL_AGENT_SYSTEMD_SANDBOX: '1'
        run: python tests/systemd_startup_sandbox.py
